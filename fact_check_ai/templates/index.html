<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fact Check AI</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: black;
            color: #00ff00;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container .container {
    width: 90%;
    max-width: 600px;
    padding: 30px;
    border: 2px solid #00ff00;
    box-shadow: 0 0 25px #00ff00;
    background: #000;
}
            
        h1 {
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 10px #00ff00;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #009900;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #00ff00;
            color: black;
        }

        .loading {
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-top: 1px dashed #00ff00;
        }

        .true { color: #00ff00; }
        .false { color: red; }
        .unknown { color: yellow; }
    </style>
</head>

<body>

<div class="container">
    <h1>🧠 FACT CHECK AI</h1>

    <form method="POST" action="/predict" onsubmit="startTyping()">
        <textarea name="news"
                  placeholder="Enter news or information here..."
                  required
                  oninput="clearResult()"></textarea>

        <button type="submit">CHECK</button>
    </form>

    <div class="loading" id="loading">
        <span id="typing"></span><span class="cursor">█</span>
    </div>

    {% if result %}
    <div class="result" id="resultBox">
        <strong>Result:</strong>
        <p class="{{ result_class }}">{{ result }}</p>
    </div>
    {% endif %}
</div>

<script>
    const text = "Analyzing news using trusted sources...";
    let index = 0;
    let typingInterval;

    function startTyping() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("typing").innerHTML = "";
        index = 0;

        typingInterval = setInterval(() => {
            if (index < text.length) {
                document.getElementById("typing").innerHTML += text.charAt(index);
                index++;
            } else {
                clearInterval(typingInterval);
            }
        }, 50);
    }

    function clearResult() {
        const resultBox = document.getElementById("resultBox");
        if (resultBox) {
            resultBox.style.display = "none";
        }
        document.getElementById("loading").style.display = "none";
        document.getElementById("typing").innerHTML = "";
        clearInterval(typingInterval);
    }
</script>

</body>
</html>
